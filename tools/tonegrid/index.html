<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tone Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  :root{
    --bg:#0a0e14;
    --bg-2:#0e131c;
    --line:rgba(120,140,170,0.10);
    --cell:rgba(150,170,200,0.05);
    --cell-edge:rgba(150,170,200,0.12);
    --ink:#f4f8ff;
    --ink-dim:#b2c0d8;
    --accent:#5ad1cd;
  }
  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    margin:0;
    background:radial-gradient(140% 90% at 50% -10%, var(--bg-2), var(--bg) 60%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-tap-highlight-color:transparent;
  }
  button,select,input{touch-action:manipulation;}
  [hidden]{display:none !important;}  /* beat the display:flex on .fx / .share */
  .stage{
    width:min(92vw,560px);
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
  }
  .title h1{
    margin:0;
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .title p{
    margin:2px 0 0;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .voice{
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:flex-end;
  }
  .voice label{
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  select{
    appearance:none;
    background:var(--bg-2);
    color:var(--ink);
    border:1px solid var(--cell-edge);
    border-radius:8px;
    padding:7px 30px 7px 12px;
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'><path d='M1 1l4 4 4-4' stroke='%237d8aa0' stroke-width='1.5'/></svg>");
    background-repeat:no-repeat;
    background-position:right 11px center;
  }
  select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .grid-wrap{position:relative;}
  .grid{
    display:grid;
    grid-template-columns:repeat(16,1fr);
    grid-template-rows:repeat(16,1fr);
    gap:3px;
    aspect-ratio:1/1;
    padding:10px;
    border-radius:14px;
    background:rgba(0,0,0,0.25);
    border:1px solid var(--line);
    touch-action:none;      /* let us drag-paint without the page scrolling */
    user-select:none;
  }
  .cell{
    border:1px solid var(--cell-edge);
    background:var(--cell);
    border-radius:4px;
    padding:0;
    cursor:pointer;
    transition:background .12s ease, box-shadow .12s ease, transform .08s ease;
  }
  .cell:hover{background:rgba(150,170,200,0.12);}
  .cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .cell.on{
    background:hsl(var(--hue) 80% 58%);
    border-color:hsl(var(--hue) 80% 70%);
    box-shadow:0 0 10px 1px hsl(var(--hue) 85% 55% / .55);
  }
  /* the playhead column */
  .cell.beam{background:rgba(150,170,200,0.14);}
  .cell.beam.on{
    transform:scale(1.12);
    box-shadow:0 0 18px 3px hsl(var(--hue) 90% 60% / .9);
    background:hsl(var(--hue) 90% 66%);
  }

  .hint{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--ink-dim);
    transition:opacity .3s ease;
  }
  .hint.gone{opacity:0;}

  .transport{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .play{
    width:46px;height:46px;
    flex:0 0 auto;
    border-radius:50%;
    border:1px solid var(--accent);
    background:rgba(90,209,205,0.10);
    color:var(--accent);
    cursor:pointer;
    display:grid;place-items:center;
    transition:background .15s ease;
  }
  .play:hover{background:rgba(90,209,205,0.2);}
  .play:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .play svg{display:block;}

  .dials{flex:1;display:flex;flex-direction:column;gap:12px;}
  .tempo{flex:1;display:flex;align-items:center;gap:12px;}
  .tempo input[type=range],
  .fx-ctrl input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1;height:3px;border-radius:3px;
    background:var(--cell-edge);
    cursor:pointer;
  }
  .tempo input[type=range]::-webkit-slider-thumb,
  .fx-ctrl input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:15px;height:15px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px hsl(178 60% 50% / .6);
  }
  .tempo input[type=range]::-moz-range-thumb,
  .fx-ctrl input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border:none;border-radius:50%;background:var(--accent);
  }
  .tempo input[type=range]:focus-visible,
  .fx-ctrl input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:6px;}

  .fx{display:flex;gap:24px;flex-wrap:wrap;}
  .fx-ctrl{flex:1;min-width:180px;display:flex;align-items:center;gap:12px;}
  .fx-ctrl input[type=range]{min-width:64px;}
  .fx-ctrl label{
    font-family:"JetBrains Mono",monospace;
    font-size:10px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--ink-dim);width:48px;flex:0 0 auto;
  }
  .fx-val{
    font-family:"JetBrains Mono",monospace;font-size:12px;
    color:var(--ink-dim);width:24px;text-align:right;flex:0 0 auto;
  }
  .bpm{
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    color:var(--ink-dim);
    white-space:nowrap;
    min-width:62px;
  }
  .bpm b{color:var(--ink);font-weight:500;}
  .btn{
    background:var(--bg-2);
    border:1px solid var(--cell-edge);
    border-radius:8px;
    cursor:pointer;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--ink-dim);
    padding:9px 16px;
    transition:color .15s ease, border-color .15s ease;
  }
  .btn:hover{color:var(--ink);border-color:var(--ink-dim);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .actions{display:flex;gap:12px;justify-content:flex-end;}

  .more{
    align-self:flex-start;
    background:none;border:none;cursor:pointer;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--ink-dim);
    padding:2px 0;margin-top:-6px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .more:hover{color:var(--ink);}
  .more:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}
  .more .caret{font-size:9px;transition:transform .2s ease;}
  .more[aria-expanded="true"] .caret{transform:rotate(180deg);}

  .chords{display:flex;flex-direction:column;gap:12px;}
  .chord-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .chord-label{
    font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;
    letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-dim);
    width:40px;flex:0 0 auto;
  }
  .chip{
    background:var(--bg-2);border:1px solid var(--cell-edge);border-radius:8px;cursor:pointer;
    font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;color:var(--ink);
    padding:7px 13px;transition:border-color .15s ease, background .15s ease;
  }
  .chip:hover{border-color:var(--accent);background:rgba(90,209,205,0.08);}
  .chip:active{background:rgba(90,209,205,0.18);}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  @media (max-width:480px){
    body{padding:14px;}
    .stage{gap:16px;}
    .title h1{font-size:24px;}
    .fx{gap:14px;}
    .fx-ctrl{min-width:100%;}
  }

  .share{display:flex;align-items:center;gap:12px;}
  .share-url{
    flex:1;min-width:0;
    background:var(--bg-2);
    border:1px solid var(--cell-edge);
    border-radius:8px;
    color:var(--ink);
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    padding:9px 12px;
  }
  .share-url:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .share-msg{
    font-family:"JetBrains Mono",monospace;font-size:10px;
    letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);
    white-space:nowrap;flex:0 0 auto;
  }

  /* clearer, bolder labels */
  .title p, .voice label, select, .fx-ctrl label, .fx-val, .bpm,
  .btn, .more, .share-url, .share-msg{ font-weight:600; }
  .voice label, .fx-ctrl label{ font-size:11px; }
  .bpm b{ font-weight:700; }

  /* view toggle + track (overview) view */
  .head-right{display:flex;align-items:flex-end;gap:12px;}
  .view-toggle{
    width:38px;height:38px;flex:0 0 auto;
    border-radius:8px;
    background:var(--bg-2);
    border:1px solid var(--cell-edge);
    color:var(--ink-dim);
    cursor:pointer;
    display:grid;place-items:center;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .view-toggle:hover{color:var(--ink);border-color:var(--ink-dim);}
  .view-toggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:rgba(90,209,205,0.10);}
  .view-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .view-toggle svg{display:block;}

  .viewpane{display:flex;flex-direction:column;gap:20px;}

  .track-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(116px,1fr));
    gap:12px;
  }
  .track-card{
    position:relative;
    background:var(--bg-2);
    border:1px solid var(--cell-edge);
    border-radius:12px;
    padding:10px;
    cursor:pointer;
    display:flex;flex-direction:column;gap:8px;
    transition:border-color .15s ease, box-shadow .15s ease;
    user-select:none;
  }
  .track-card:hover{border-color:var(--ink-dim);}
  .track-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .track-card.muted{opacity:0.45;}
  .track-thumb{
    width:100%;aspect-ratio:1/1;display:block;
    border-radius:6px;
    background:rgba(0,0,0,0.30);
    border:1px solid var(--line);
  }
  .track-foot{display:flex;align-items:center;gap:7px;}
  .track-dot{
    width:8px;height:8px;flex:0 0 auto;border-radius:50%;
    background:hsl(var(--thue) 70% 55%);
  }
  .track-name{
    flex:1;min-width:0;
    font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;
    color:var(--ink-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .track-mute{
    flex:0 0 auto;width:22px;height:22px;
    border-radius:6px;
    background:none;border:1px solid var(--cell-edge);
    color:var(--ink-dim);
    font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .track-mute:hover{color:var(--ink);border-color:var(--ink-dim);}
  .track-mute.on{color:var(--accent);border-color:var(--accent);background:rgba(90,209,205,0.14);}
  .track-remove{
    position:absolute;top:6px;right:6px;
    width:18px;height:18px;
    border-radius:50%;
    background:rgba(0,0,0,0.45);border:1px solid var(--cell-edge);
    color:var(--ink-dim);
    font-size:13px;line-height:1;cursor:pointer;
    display:none;place-items:center;
    padding:0;
  }
  .track-card:hover .track-remove{display:grid;}
  .track-remove:hover{color:var(--ink);border-color:var(--ink-dim);}
  .track-add{
    min-height:116px;
    border:1px dashed var(--cell-edge);
    border-radius:12px;
    background:none;
    color:var(--ink-dim);
    font-size:30px;font-weight:300;line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:color .15s ease, border-color .15s ease;
  }
  .track-add:hover{color:var(--accent);border-color:var(--accent);}
  .track-add:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  @media (prefers-reduced-motion:reduce){
    .cell,.cell.beam.on{transition:none;transform:none;}
  }
</style>
</head>
<body>
  <div class="stage">
    <header>
      <div class="title">
        <h1>Tone Grid</h1>
        <p>pentatonic step sequencer</p>
      </div>
      <div class="head-right">
        <button class="view-toggle" id="viewToggle" aria-pressed="false" aria-label="Toggle track view" title="Track view">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="7" height="7" rx="1.5" fill="currentColor"/>
            <rect x="10" y="1" width="7" height="7" rx="1.5" fill="currentColor"/>
            <rect x="1" y="10" width="7" height="7" rx="1.5" fill="currentColor"/>
            <rect x="10" y="10" width="7" height="7" rx="1.5" fill="currentColor"/>
          </svg>
        </button>
        <div class="voice" id="voiceWrap">
          <label for="voice">voice</label>
          <select id="voice">
            <option value="am">AM hollow</option>
            <option value="bell" selected>Bell</option>
            <option value="drum">Drum bass</option>
            <option value="duo">Duo (fat)</option>
            <option value="fm">FM electric</option>
            <option value="glass">Glass FM</option>
            <option value="mono">Mono lead</option>
            <option value="pad">Pad</option>
            <option value="pluck">Pluck</option>
            <option value="pulse">Pulse</option>
            <option value="pwm">PWM</option>
            <option value="square">Square lead</option>
            <option value="supersaw">Supersaw</option>
          </select>
        </div>
      </div>
    </header>

    <div id="matrixView" class="viewpane">
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
      <div class="hint" id="hint">click cells &middot; press play</div>
    </div>

    <div class="fx">
      <div class="fx-ctrl">
        <label for="reverb">reverb</label>
        <input type="range" id="reverb" min="0" max="100" value="35" aria-label="Reverb mix">
        <span class="fx-val" id="reverbVal">35</span>
      </div>
      <div class="fx-ctrl">
        <label for="delay">delay</label>
        <input type="range" id="delay" min="0" max="100" value="0" aria-label="Delay mix">
        <span class="fx-val" id="delayVal">0</span>
      </div>
    </div>

    <button class="more" id="more" aria-expanded="false" aria-controls="moreFx">more effects <span class="caret" aria-hidden="true">&#9662;</span></button>

    <div class="fx fx-more" id="moreFx" hidden>
      <div class="fx-ctrl">
        <label for="chorus">chorus</label>
        <input type="range" id="chorus" min="0" max="100" value="0" aria-label="Chorus mix">
        <span class="fx-val" id="chorusVal">0</span>
      </div>
      <div class="fx-ctrl">
        <label for="autofilter">filter</label>
        <input type="range" id="autofilter" min="0" max="100" value="0" aria-label="Auto-filter mix">
        <span class="fx-val" id="autofilterVal">0</span>
      </div>
      <div class="fx-ctrl">
        <label for="dist">drive</label>
        <input type="range" id="dist" min="0" max="100" value="0" aria-label="Distortion mix">
        <span class="fx-val" id="distVal">0</span>
      </div>
      <div class="fx-ctrl">
        <label for="crusher">crush</label>
        <input type="range" id="crusher" min="0" max="100" value="0" aria-label="Bitcrusher mix">
        <span class="fx-val" id="crusherVal">0</span>
      </div>
      <div class="fx-ctrl">
        <label for="ping">ping</label>
        <input type="range" id="ping" min="0" max="100" value="0" aria-label="Ping-pong delay mix">
        <span class="fx-val" id="pingVal">0</span>
      </div>
      <div class="fx-ctrl">
        <label for="phaser">phase</label>
        <input type="range" id="phaser" min="0" max="100" value="0" aria-label="Phaser mix">
        <span class="fx-val" id="phaserVal">0</span>
      </div>
      <div class="fx-ctrl">
        <label for="cutoff">cutoff</label>
        <input type="range" id="cutoff" min="0" max="100" value="100" aria-label="Filter cutoff">
        <span class="fx-val" id="cutoffVal">100</span>
      </div>
      <div class="fx-ctrl">
        <label for="reso">reso</label>
        <input type="range" id="reso" min="0" max="100" value="0" aria-label="Filter resonance">
        <span class="fx-val" id="resoVal">0</span>
      </div>
    </div>

    <button class="more" id="chordsToggle" aria-expanded="false" aria-controls="chordPanel">chords <span class="caret" aria-hidden="true">&#9662;</span></button>

    <div class="chords" id="chordPanel" hidden>
      <div class="chord-group">
        <span class="chord-label">maj7</span>
        <button class="chip" data-chord="Cmaj7">Cmaj7</button>
      </div>
      <div class="chord-group">
        <span class="chord-label">min7</span>
        <button class="chip" data-chord="Am7">Am7</button>
        <button class="chip" data-chord="Dm7">Dm7</button>
        <button class="chip" data-chord="Em7">Em7</button>
      </div>
    </div>
    </div>

    <div id="tracksView" class="viewpane" hidden>
      <div class="track-grid" id="trackGrid"></div>
    </div>

    <div class="transport">
      <button class="play" id="play" aria-label="Play">
        <svg id="playIcon" width="16" height="18" viewBox="0 0 16 18"><path d="M1 1l14 8-14 8z" fill="currentColor"/></svg>
      </button>
      <div class="dials">
        <div class="tempo">
          <input type="range" id="tempo" min="50" max="220" value="118" aria-label="Tempo">
          <span class="bpm"><b id="bpmVal">118</b> BPM</span>
        </div>
        <div class="tempo">
          <input type="range" id="volume" min="0" max="100" value="85" aria-label="Volume">
          <span class="bpm"><b id="volVal">85</b> VOL</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="save">copy link</button>
      <button class="btn" id="clear">clear</button>
    </div>
  </div>

<script>
const STEPS = 16;
const ROWS = 16;
const MAX_TRACKS = 16;

// Major pentatonic, low -> high. Any pattern stays consonant — that's the ToneMatrix trick.
const SCALE = ['C3','D3','E3','G3','A3','C4','D4','E4','G4','A4','C5','D5','E5','G5','A5','C6'];
const noteForRow = r => SCALE[ROWS - 1 - r];

const VOICES = {
  pluck:  { synth:Tone.Synth, opts:{oscillator:{type:'triangle'}, envelope:{attack:0.005,decay:0.30,sustain:0.0,release:0.9}}, level:-9, reverb:0.35, delay:0.0 },
  bell:   { synth:Tone.Synth, opts:{oscillator:{type:'sine'},     envelope:{attack:0.002,decay:1.20,sustain:0.0,release:1.8}}, level:-9, reverb:0.60, delay:0.0 },
  square: { synth:Tone.Synth, opts:{oscillator:{type:'square'},   envelope:{attack:0.010,decay:0.20,sustain:0.2,release:0.2}}, level:-9, reverb:0.12, delay:0.0 },
  pad:    { synth:Tone.Synth, opts:{oscillator:{type:'sawtooth'}, envelope:{attack:0.40,decay:0.30,sustain:0.6,release:1.4}},  level:-9, reverb:0.55, delay:0.0 },
  fm:   { synth:Tone.FMSynth,      opts:{harmonicity:3, modulationIndex:10, envelope:{attack:0.01,decay:0.4,sustain:0.1,release:0.9}, modulationEnvelope:{attack:0.01,decay:0.6,sustain:0.2,release:0.6}}, level:-12, reverb:0.30, delay:0.18 },
  am:   { synth:Tone.AMSynth,      opts:{harmonicity:2, envelope:{attack:0.01,decay:0.5,sustain:0.2,release:0.9}, modulation:{type:'square'}}, level:-11, reverb:0.35, delay:0.12 },
  mono: { synth:Tone.MonoSynth,    opts:{oscillator:{type:'sawtooth'}, filter:{Q:3,type:'lowpass'}, envelope:{attack:0.02,decay:0.2,sustain:0.3,release:0.6}, filterEnvelope:{attack:0.03,decay:0.3,sustain:0.4,release:0.8,baseFrequency:220,octaves:3.5}}, level:-12, reverb:0.20, delay:0.15 },
  duo:  { synth:Tone.DuoSynth,     opts:{vibratoAmount:0.3, harmonicity:1.5, voice0:{oscillator:{type:'sawtooth'},envelope:{attack:0.05,decay:0.3,sustain:0.4,release:0.9}}, voice1:{oscillator:{type:'sawtooth'},envelope:{attack:0.05,decay:0.3,sustain:0.4,release:0.9}}}, level:-16, reverb:0.30, delay:0.20 },
  drum: { synth:Tone.MembraneSynth, opts:{pitchDecay:0.05, octaves:5, envelope:{attack:0.001,decay:0.4,sustain:0.0,release:0.3}}, level:-8, reverb:0.10, delay:0.0 },
  supersaw: { synth:Tone.Synth, opts:{oscillator:{type:'fatsawtooth', count:3, spread:32}, envelope:{attack:0.03,decay:0.3,sustain:0.5,release:1.0}}, level:-15, reverb:0.35, delay:0.0 },
  pwm:      { synth:Tone.Synth, opts:{oscillator:{type:'pwm', modulationFrequency:0.6}, envelope:{attack:0.02,decay:0.25,sustain:0.5,release:0.6}}, level:-12, reverb:0.25, delay:0.10 },
  pulse:    { synth:Tone.Synth, opts:{oscillator:{type:'pulse', width:0.35}, envelope:{attack:0.005,decay:0.2,sustain:0.3,release:0.3}}, level:-13, reverb:0.20, delay:0.08 },
  glass:    { synth:Tone.Synth, opts:{oscillator:{type:'fmsine', harmonicity:2, modulationIndex:3}, envelope:{attack:0.004,decay:0.8,sustain:0.0,release:1.2}}, level:-12, reverb:0.45, delay:0.10 },
};
const VOICE_LABEL = { am:'AM hollow', bell:'Bell', drum:'Drum bass', duo:'Duo', fm:'FM electric', glass:'Glass FM', mono:'Mono lead', pad:'Pad', pluck:'Pluck', pulse:'Pulse', pwm:'PWM', square:'Square lead', supersaw:'Supersaw' };

// each fx slider: [sliderId, readoutId, state key, (nodes, f, track) => apply]
const FX_WIRING = [
  ['reverb',     'reverbVal',     'reverb',     (n,f)=>n.reverb.wet.value=f],
  ['delay',      'delayVal',      'delay',      (n,f)=>n.delay.wet.value=f],
  ['chorus',     'chorusVal',     'chorus',     (n,f)=>n.chorus.wet.value=f],
  ['autofilter', 'autofilterVal', 'autofilter', (n,f)=>n.autoFilter.wet.value=f],
  ['dist',       'distVal',       'dist',       (n,f)=>{ n.dist.distortion=f; n.dist.wet.value = f>0?1:0; }],
  ['crusher',    'crusherVal',    'crusher',    (n,f)=>n.crusher.wet.value=f],
  ['ping',       'pingVal',       'ping',       (n,f)=>{ n.pingpong.wet.value=f; n.pingpong.feedback.value=0.2+f*0.65; }],
  ['phaser',     'phaserVal',     'phaser',     (n,f)=>n.phaser.wet.value=f],
  ['cutoff',     'cutoffVal',     'cutoff',     (n,f)=>n.filt.frequency.value=20*Math.pow(1000,f)],
  ['reso',       'resoVal',       'reso',       (n,f)=>n.filt.Q.value=0.7+f*18],
];

const ROW_OF = {};
SCALE.forEach((n, i) => { ROW_OF[n] = ROWS - 1 - i; });
const CHORDS = {
  'Cmaj7': ['C4','E4','G4'],
  'Am7':   ['A3','C4','E4','G4'],
  'Dm7':   ['D4','A4','C5'],
  'Em7':   ['E4','G4','D5'],
};

// ---- state ----
function makeTrack(voice='bell'){
  const v = VOICES[voice] || VOICES.bell;
  return {
    grid: Array.from({length:STEPS}, () => Array(ROWS).fill(false)),
    voice,
    fx: { reverb:Math.round(v.reverb*100), delay:Math.round(v.delay*100),
          chorus:0, autofilter:0, dist:0, crusher:0, ping:0, phaser:0, cutoff:100, reso:0 },
    muted:false,
    nodes:null,
    seq:null,
  };
}
let tracks = [ makeTrack('bell') ];
let active = 0;
let started = false;
let compressor, limiter, beamSeq = null;
let chordCol = 0;
let painting = false, paintValue = true;

// ---- DOM refs ----
const gridEl     = document.getElementById('grid');
const hintEl     = document.getElementById('hint');
const voiceSelect= document.getElementById('voice');
const voiceWrap  = document.getElementById('voiceWrap');
const matrixView = document.getElementById('matrixView');
const tracksView = document.getElementById('tracksView');
const trackGrid  = document.getElementById('trackGrid');
const viewToggle = document.getElementById('viewToggle');
const playBtn    = document.getElementById('play');
const playIcon   = document.getElementById('playIcon');
const tempo      = document.getElementById('tempo');
const bpmVal     = document.getElementById('bpmVal');
const volSlider  = document.getElementById('volume');
const volVal     = document.getElementById('volVal');
const saveBtn    = document.getElementById('save');

// ---- grid editor (shows the active track) ----
const cells = [];
for (let r = 0; r < ROWS; r++){
  const hue = Math.round(30 + ((ROWS - 1 - r) / (ROWS - 1)) * 170);
  for (let s = 0; s < STEPS; s++){
    const cell = document.createElement('button');
    cell.className = 'cell';
    cell.style.setProperty('--hue', hue);
    cell.setAttribute('aria-label', `step ${s+1} note ${noteForRow(r)}`);
    cell.setAttribute('aria-pressed', 'false');
    cell.dataset.s = s; cell.dataset.r = r;
    cell.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setCell(s, r, !tracks[active].grid[s][r]); }
    });
    gridEl.appendChild(cell);
    (cells[s] ||= [])[r] = cell;
  }
}

function setCell(s, r, on){
  const t = tracks[active];
  t.grid[s][r] = on;
  const cell = cells[s][r];
  cell.classList.toggle('on', on);
  cell.setAttribute('aria-pressed', String(on));
  if (on){ hintEl.classList.add('gone'); ensureTrackAudio(t); }
}
function repaintGrid(){
  const g = tracks[active].grid;
  let any = false;
  for (let s=0;s<STEPS;s++) for (let r=0;r<ROWS;r++){
    const on = g[s][r];
    if (on) any = true;
    cells[s][r].classList.toggle('on', on);
    cells[s][r].setAttribute('aria-pressed', String(on));
  }
  hintEl.classList.toggle('gone', any);
}

function cellFromPoint(x, y){
  const el = document.elementFromPoint(x, y);
  if (!el || !el.classList.contains('cell')) return null;
  return { s:+el.dataset.s, r:+el.dataset.r };
}
gridEl.addEventListener('pointerdown', (e) => {
  const c = cellFromPoint(e.clientX, e.clientY);
  if (!c) return;
  e.preventDefault();
  painting = true;
  paintValue = !tracks[active].grid[c.s][c.r];
  setCell(c.s, c.r, paintValue);
});
gridEl.addEventListener('pointermove', (e) => {
  if (!painting) return;
  const c = cellFromPoint(e.clientX, e.clientY);
  if (c) setCell(c.s, c.r, paintValue);
});
window.addEventListener('pointerup', () => { painting = false; });
window.addEventListener('pointercancel', () => { painting = false; });

// ---- audio ----
// per track:  poly -> filt -> dist -> crush -> chorus -> phaser -> autoFilter
//                  -> delay -> pingpong -> reverb -> channel -> [master] -> out
// master (shared): compressor -> limiter -> destination
function buildMaster(){
  limiter    = new Tone.Limiter(-2).toDestination();
  compressor = new Tone.Compressor({threshold:-6, ratio:3, attack:0.003, release:0.18, knee:8}).connect(limiter);
}
function makePoly(voiceKey){
  const v = VOICES[voiceKey] || VOICES.bell;
  const p = new Tone.PolySynth(v.synth);
  p.set(v.opts);
  p.volume.value = v.level;
  return p;
}
function buildTrackNodes(t){
  const n = {};
  n.channel  = new Tone.Channel().connect(compressor);
  n.reverb   = new Tone.Reverb({decay:3, wet:0}).connect(n.channel);
  n.pingpong = new Tone.PingPongDelay({delayTime:'8n', feedback:0.30, wet:0}).connect(n.reverb);
  n.delay    = new Tone.FeedbackDelay({delayTime:'8n', feedback:0.32, wet:0}).connect(n.pingpong);
  n.autoFilter = new Tone.AutoFilter({frequency:'8n', type:'sine', depth:0.8, baseFrequency:400, octaves:2.6, filter:{type:'lowpass', rolloff:-12, Q:2}, wet:0}).connect(n.delay);
  n.autoFilter.start();
  n.phaser   = new Tone.Phaser({frequency:0.5, octaves:3, baseFrequency:350, wet:0}).connect(n.autoFilter);
  n.chorus   = new Tone.Chorus({frequency:1.5, delayTime:3.5, depth:0.7, wet:0}).connect(n.phaser);
  n.chorus.start();
  n.crusher  = new Tone.BitCrusher({bits:4}).connect(n.chorus); n.crusher.wet.value = 0;
  n.dist     = new Tone.Distortion({distortion:0, oversample:'2x'}).connect(n.crusher); n.dist.wet.value = 0;
  n.filt     = new Tone.Filter({type:'lowpass', frequency:20000, Q:0.7, rolloff:-12}).connect(n.dist);
  n.poly     = makePoly(t.voice).connect(n.filt);
  t.nodes = n;
  n.channel.mute = t.muted;
  applyFxToNodes(t);
  if (!t.seq) buildTrackSeq(t);
}
function disposeTrackNodes(t){
  const n = t.nodes; if (!n) return;
  ['poly','filt','dist','crusher','chorus','phaser','autoFilter','delay','pingpong','reverb','channel']
    .forEach(k => { try { n[k].dispose(); } catch(e){} });
  t.nodes = null;
}
function trackHasNotes(t){ return t.grid.some(col => col.some(v => v)); }
function ensureTrackAudio(t){ if (started && !t.nodes) buildTrackNodes(t); }
function applyFxToNodes(t){
  if (!t.nodes) return;
  FX_WIRING.forEach(([id,valId,key,apply]) => apply(t.nodes, t.fx[key] / 100, t));
}
function buildTrackSeq(t){
  t.seq = new Tone.Sequence((time, step) => {
    if (t.muted || !t.nodes) return;
    const notes = [];
    for (let r = 0; r < ROWS; r++) if (t.grid[step][r]) notes.push(noteForRow(r));
    if (notes.length) t.nodes.poly.triggerAttackRelease(notes, '8n', time);
  }, [...Array(STEPS).keys()], '8n');
  t.seq.start(0);
}

// playhead — one beam for whatever matrix is on screen
let lastBeam = -1;
function beam(step){
  if (lastBeam >= 0) for (let r=0;r<ROWS;r++) cells[lastBeam][r].classList.remove('beam');
  for (let r=0;r<ROWS;r++) cells[step][r].classList.add('beam');
  lastBeam = step;
}
function clearBeam(){
  if (lastBeam >= 0) for (let r=0;r<ROWS;r++) cells[lastBeam][r].classList.remove('beam');
  lastBeam = -1;
}
function buildBeam(){
  beamSeq = new Tone.Sequence((time, step) => { Tone.Draw.schedule(() => beam(step), time); }, [...Array(STEPS).keys()], '8n');
  beamSeq.start(0);
}

// ---- controls (edit the active track) ----
function setFxUI(id, valId, n){ document.getElementById(id).value = n; document.getElementById(valId).textContent = n; }

function wireFx(id, valId, key, applyNode){
  const slider = document.getElementById(id), valEl = document.getElementById(valId);
  slider.addEventListener('input', () => {
    valEl.textContent = slider.value;
    const t = tracks[active];
    t.fx[key] = +slider.value;
    if (t.nodes) applyNode(t.nodes, +slider.value / 100, t);
  });
}
FX_WIRING.forEach(([id,valId,key,apply]) => wireFx(id, valId, key, apply));

voiceSelect.addEventListener('change', () => {
  const t = tracks[active], name = voiceSelect.value, v = VOICES[name];
  t.voice = name;
  t.fx.reverb = Math.round(v.reverb * 100);   // restore the voice's signature reverb/delay
  t.fx.delay  = Math.round(v.delay * 100);
  setFxUI('reverb','reverbVal', t.fx.reverb);
  setFxUI('delay','delayVal', t.fx.delay);
  if (t.nodes){
    t.nodes.poly.disconnect(); t.nodes.poly.dispose();
    t.nodes.poly = makePoly(name).connect(t.nodes.filt);
    applyFxToNodes(t);
  }
});

function syncControls(){
  const t = tracks[active];
  voiceSelect.value = t.voice;
  FX_WIRING.forEach(([id,valId,key]) => setFxUI(id, valId, t.fx[key]));
  repaintGrid();
}

// tempo + master volume (global)
Tone.Transport.bpm.value = +tempo.value;
tempo.addEventListener('input', () => { bpmVal.textContent = tempo.value; Tone.Transport.bpm.value = +tempo.value; });
function setVolume(){
  volVal.textContent = volSlider.value;
  const pct = +volSlider.value;
  Tone.getDestination().volume.value = pct <= 0 ? -Infinity : 20 * Math.log10(pct / 100);
}
volSlider.addEventListener('input', setVolume);
setVolume();

// ---- transport ----
let playing = false;
playBtn.addEventListener('click', async () => {
  if (!started){
    await Tone.start();
    buildMaster();
    buildBeam();
    tracks.forEach(t => { if (trackHasNotes(t)) buildTrackNodes(t); });
    started = true;
  }
  playing = !playing;
  if (playing){
    Tone.Transport.start();
    playIcon.innerHTML = '<rect x="2" y="1" width="4" height="16" fill="currentColor"/><rect x="10" y="1" width="4" height="16" fill="currentColor"/>';
    playBtn.setAttribute('aria-label','Pause');
  } else {
    Tone.Transport.pause();
    clearBeam();
    playIcon.innerHTML = '<path d="M1 1l14 8-14 8z" fill="currentColor"/>';
    playBtn.setAttribute('aria-label','Play');
  }
});

// ---- clear + chords (act on the active track) ----
function clearGrid(){
  const g = tracks[active].grid;
  for (let s=0;s<STEPS;s++) for (let r=0;r<ROWS;r++) g[s][r] = false;
  repaintGrid();
  chordCol = 0;
}
document.getElementById('clear').addEventListener('click', clearGrid);

function drawChord(name){
  const notes = CHORDS[name]; if (!notes) return;
  const g = tracks[active].grid;
  let col = chordCol;
  for (let k=0;k<STEPS;k++){ const s=(chordCol+k)%STEPS; if (g[s].every(v=>!v)){ col=s; break; } }
  for (let r=0;r<ROWS;r++) setCell(col, r, false);
  for (const n of notes){ const r=ROW_OF[n]; if (r!=null) setCell(col, r, true); }
  chordCol = (col + 1) % STEPS;
}
document.querySelectorAll('#chordPanel .chip').forEach(b => b.addEventListener('click', () => drawChord(b.dataset.chord)));

// ---- disclosures ----
const moreBtn = document.getElementById('more');
const moreFx  = document.getElementById('moreFx');
moreBtn.addEventListener('click', () => {
  const opening = moreFx.hidden;
  moreFx.hidden = !opening;
  moreBtn.setAttribute('aria-expanded', String(opening));
  moreBtn.firstChild.textContent = opening ? 'fewer effects ' : 'more effects ';
});
const chordsToggle = document.getElementById('chordsToggle');
const chordPanel = document.getElementById('chordPanel');
chordsToggle.addEventListener('click', () => {
  const opening = chordPanel.hidden;
  chordPanel.hidden = !opening;
  chordsToggle.setAttribute('aria-expanded', String(opening));
});

// ---- track (overview) view ----
const trackHue = i => (i * 47 + 200) % 360;
function drawThumb(cv, t){
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  const cw = W/STEPS, ch = H/ROWS;
  for (let s=0;s<STEPS;s++) for (let r=0;r<ROWS;r++){
    if (t.grid[s][r]){
      const hue = Math.round(30 + ((ROWS-1-r)/(ROWS-1))*170);
      ctx.fillStyle = `hsl(${hue} 80% 58%)`;
      ctx.fillRect(s*cw, r*ch, Math.ceil(cw), Math.ceil(ch));
    }
  }
}
function renderTracksView(){
  trackGrid.innerHTML = '';
  tracks.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = 'track-card' + (i===active ? ' active' : '') + (t.muted ? ' muted' : '');
    card.style.setProperty('--thue', trackHue(i));

    const cv = document.createElement('canvas');
    cv.width = 128; cv.height = 128; cv.className = 'track-thumb';
    drawThumb(cv, t);
    card.appendChild(cv);

    const foot = document.createElement('div');
    foot.className = 'track-foot';
    const dot = document.createElement('span'); dot.className = 'track-dot';
    const name = document.createElement('span'); name.className = 'track-name'; name.textContent = VOICE_LABEL[t.voice] || t.voice;
    const mute = document.createElement('button');
    mute.className = 'track-mute' + (t.muted ? ' on' : ''); mute.textContent = 'M'; mute.title = 'Mute';
    mute.addEventListener('click', ev => {
      ev.stopPropagation();
      t.muted = !t.muted;
      if (t.nodes) t.nodes.channel.mute = t.muted;
      renderTracksView();
    });
    foot.append(dot, name, mute);
    card.appendChild(foot);

    if (tracks.length > 1){
      const rm = document.createElement('button');
      rm.className = 'track-remove'; rm.textContent = '\u00d7'; rm.title = 'Remove track';
      rm.addEventListener('click', ev => { ev.stopPropagation(); removeTrack(i); });
      card.appendChild(rm);
    }
    card.addEventListener('click', () => openTrack(i));
    trackGrid.appendChild(card);
  });
  if (tracks.length < MAX_TRACKS){
    const add = document.createElement('button');
    add.className = 'track-add'; add.textContent = '+'; add.title = 'Add track';
    add.setAttribute('aria-label', 'Add track');
    add.addEventListener('click', () => addTrack());
    trackGrid.appendChild(add);
  }
}
function openTrack(i){
  active = i;
  syncControls();
  setView('matrix');
}
function addTrack(){
  if (tracks.length >= MAX_TRACKS) return;
  tracks.push(makeTrack('bell'));
  openTrack(tracks.length - 1);   // drop straight into editing the new (empty) track
}
function removeTrack(i){
  if (tracks.length <= 1) return;
  const t = tracks[i];
  if (t.seq){ t.seq.stop(); t.seq.dispose(); }
  disposeTrackNodes(t);
  tracks.splice(i, 1);
  if (active > i) active--; else if (active >= tracks.length) active = tracks.length - 1;
  syncControls();
  renderTracksView();
}
function setView(view){
  const tv = view === 'tracks';
  matrixView.hidden = tv;
  tracksView.hidden = !tv;
  voiceWrap.hidden = tv;
  viewToggle.setAttribute('aria-pressed', String(tv));
  if (tv) renderTracksView();
}
viewToggle.addEventListener('click', () => setView(tracksView.hidden ? 'tracks' : 'matrix'));

// ---- share: whole session in the hash ----
// #t=140&a=0&k=<track>;<track>   where track = voice|fx.dot.joined|notes|muted
function gridToCodes(g){
  const out = [];
  for (let s=0;s<STEPS;s++) for (let r=0;r<ROWS;r++) if (g[s][r]) out.push(String.fromCharCode(97+s) + (r+1));
  return out.join(',');
}
function codesToGrid(g, str){
  for (let s=0;s<STEPS;s++) for (let r=0;r<ROWS;r++) g[s][r] = false;
  const tokens = String(str||'').toLowerCase().match(/[a-p]\d{1,2}/g) || [];
  for (const tk of tokens){
    const s = tk.charCodeAt(0) - 97, r = parseInt(tk.slice(1),10) - 1;
    if (s>=0 && s<STEPS && r>=0 && r<ROWS) g[s][r] = true;
  }
}
const clamp100 = n => Math.max(0, Math.min(100, n));
function trackToStr(t){
  const fx = FX_WIRING.map(([id,vId,key]) => t.fx[key]).join('.');
  return [t.voice, fx, gridToCodes(t.grid), t.muted ? 1 : 0].join('|');
}
function buildShareHash(){
  return ['t=' + tempo.value, 'a=' + active, 'k=' + tracks.map(trackToStr).join(';')].join('&');
}
function parseTrack(str){
  const [voice, fxStr, notesStr, muted] = str.split('|');
  const t = makeTrack(VOICES[voice] ? voice : 'bell');
  const fxVals = (fxStr || '').split('.');
  FX_WIRING.forEach(([id,vId,key], idx) => { const n = parseInt(fxVals[idx],10); if (!isNaN(n)) t.fx[key] = clamp100(n); });
  codesToGrid(t.grid, notesStr);
  t.muted = muted === '1';
  return t;
}
function applyShareHash(hash){
  if (!hash) return;
  const p = {};
  for (const part of hash.split('&')){ const i = part.indexOf('='); if (i > 0) p[part.slice(0,i)] = part.slice(i+1); }

  if (p.t){
    const bpm = Math.max(50, Math.min(220, parseInt(p.t,10) || 118));
    tempo.value = bpm; bpmVal.textContent = bpm; Tone.Transport.bpm.value = bpm;
  }
  if (p.k != null){
    const list = p.k.split(';').filter(Boolean).map(parseTrack);
    if (list.length){ tracks = list; active = Math.max(0, Math.min(parseInt(p.a,10)||0, tracks.length-1)); }
  } else if (p.v != null || p.n != null){
    // legacy single-patch format
    const t = makeTrack(VOICES[p.v] ? p.v : 'bell');
    const map = { rev:'reverb', dly:'delay', cho:'chorus', fil:'autofilter', drv:'dist', cru:'crusher', png:'ping', phs:'phaser', cut:'cutoff', res:'reso' };
    for (const [short,key] of Object.entries(map)){ if (p[short]!=null){ const n=parseInt(p[short],10); if(!isNaN(n)) t.fx[key]=clamp100(n); } }
    codesToGrid(t.grid, p.n || '');
    tracks = [t]; active = 0;
  }
}
saveBtn.addEventListener('click', async () => {
  const hash = buildShareHash();
  try { location.hash = hash; } catch (e) {}
  const url = location.href.split('#')[0] + '#' + hash;
  const orig = saveBtn.textContent;
  try { await navigator.clipboard.writeText(url); saveBtn.textContent = 'copied'; }
  catch (e) { saveBtn.textContent = 'copy failed'; }
  setTimeout(() => { saveBtn.textContent = orig; }, 1400);
});

// ---- init ----
{
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h) applyShareHash(h);
  syncControls();
}
</script>
</body>
</html>
